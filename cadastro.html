<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="general">
        <div id="header">
            <div id="top">
                <div class="logo">
                    <img src="#" alt="logo">
                </div>
                
                <div class="menu">
                    <ul>
                        <li>
                            <a href="#">Home</a>
                            <a href="#">Sobre</a>
                            <a href="#">Fazer login</a>
                            <a href="#">Cadastre-se</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div id="slider">

            </div>
        </div>
        <div id="content">
            <h1>Cadastre-se</h1>

            <form name="cadastro" method="post" action="#">
                <label>
                    <strong>Nome</strong>
                    <input type="text" name="name" placeholder="Nome">
                </label><br />

                <label>
                    <strong>Email</strong>
                    <input type="email" name="email" placeholder="Email">
                </label><br />
                
                <label for="opt-cliente">Cliente
                    <input type="radio" name="user" id="opt-cliente" value="cliente" />
                </label><br />
                
                <label for="opt-motorista">Motorista
                    <input type="radio" name="user" id="opt-motorista" value="motorista" />
                </label><br />

                <label>
                    <strong>Senha</strong>
                    <input type="password" name="senha" placeholder="Senha" />
                </label><br />

                <label>
                    <strong>Confirmar senha</strong>
                    <input type="password" name="senha" placeholder="Senha" />
                </label>

                <input type="submit" value="Cadastrar" />
            </form>
        </div>
        <div id="footer">

        </div>
    </div>
    
</body>
</html>
