<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyStop | Cadastre-se</title>
</head>
<body>
    <div id="general">
        <div id="header">
            <div id="top">
                <div class="logo">
                    <img src="#" alt="logo">
                </div>
                
                <div class="menu">
                    <ul>
                        <li>
                            <a href="index.html">Home</a>
                            <a href="login.html">Fazer login</a>
                            <a href="#">Cadastre-se</a>
                        </li>
                    </ul>
                </div>
            </div>
            <div id="slider">

            </div>
        </div>
        <div id="content">
            <h1>Reserva</h1>

            <form name="cadastro" method="post" action="#">
                <div>
                    <label>
                        <strong>Nome</strong>
                        <input type="text" name="name" placeholder="Nome">
                    </label>
                </div>

                <div>
                    <label>
                        <strong>Email</strong>
                        <input type="email" name="email" placeholder="Email">
                    </label>
                </div>

                <div>
                    <label for="opt-cliente">Cliente
                        <input type="radio" name="user" id="opt-cliente" value="cliente" />
                    </label>
                </div>

                <div>
                    <label for="opt-motorista">Motorista
                        <input type="radio" name="user" id="opt-motorista" value="motorista" />
                    </label>
                </div>

                <div>
                    <label>
                        <strong>Senha</strong>
                        <input type="password" name="password" placeholder="Senha" />
                    </label>
                </div>

                <div>
                    <label>
                        <strong>Confirmar senha</strong>
                        <input type="password" name="password" placeholder="Senha" />
                    </label>
                </div>

                <input type="submit" value="Cadastrar" />
            </form>
        </div>
        <div id="footer">

        </div>
    </div>
    
</body>
</html>
