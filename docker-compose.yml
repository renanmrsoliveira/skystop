version: "3.8"  

services:
  apache:
    image: php:8.2-apache
    container_name: php8
    restart: always
    ports:
      - "80:80"
    depends_on:
      - mysqldb
    volumes:
      - ./:/var/www/html    
    environment:
      - APACHE_RUN_USER=www-data 

  mysqldb:
    image: mysql:8.4
    container_name: mysql8
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: biblioteca
    volumes:
      - ./mysql_data:/var/lib/mysql 